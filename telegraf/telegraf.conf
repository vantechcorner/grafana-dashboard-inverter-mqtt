[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  hostname = "iriv-pi-control"
  omit_hostname = true

###############################################################################
# Output — raw high-resolution series (60d retention on bucket)
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "solar_raw"

###############################################################################
# Inverter 1 — Deye SG06  (MQTT base: iriv/ivt  — do NOT change for HA / ESP32)
# Tag device=sg06  → Grafana label "Deye SG06"
###############################################################################
[[inputs.mqtt_consumer]]
  # Host Mosquitto (separate container / host network), same as before
  servers = ["tcp://192.168.3.249:1883"]
  topics = ["iriv/ivt/#"]
  qos = 0
  connection_timeout = "30s"
  data_format = "json"
  topic_tag = ""
  name_override = "solar"
  fieldinclude = ["value"]

  [inputs.mqtt_consumer.tags]
    device = "sg06"

  # iriv/ivt/battery/power → component=battery, metric=power
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iriv/ivt/+/+"
    tags = "_/_/component/metric"

  # iriv/ivt/status → metric=status (component filled by defaults)
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iriv/ivt/+"
    tags = "_/_/metric"


###############################################################################
# Processors
###############################################################################
# status topic has no component segment
[[processors.defaults]]
  namepass = ["solar"]
  [processors.defaults.tags]
    component = "system"

# Derived house load (W) + house energy today (kWh) — same rules as
# deye-mqtt-dashboard-p4-7 telemetry_house_power_w / home_energy_today
[[processors.starlark]]
  namepass = ["solar"]
  script = "/etc/telegraf/house_derived.star"
